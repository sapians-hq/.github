name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: wbendinelli/.github/.github/workflows/release-please.yml@v0.8.0
    permissions:
      contents: write
      pull-requests: write
